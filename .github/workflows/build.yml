name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q *.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - run: gradle build --no-daemon
        working-directory: brickk-visuals
      - uses: actions/upload-artifact@v4
        with:
          name: brickk-visuals-jar
          path: brickk-visuals/build/libs/*.jar
