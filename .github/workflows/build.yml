name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          for f in *.zip; do unzip -q -o "$f"; done
          sed -i "/reobfJar/d" brickk-visuals/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - run: gradle build --no-daemon
        working-directory: brickk-visuals
      - uses: actions/upload-artifact@v4
        with:
          name: brickk-visuals-jar
          path: brickk-visuals/build/libs/*.jar
